name = "flarefolio"
compatibility_date = "2025-06-01"

# 声明 Pages 输出目录：Git 集成构建时 wrangler 由此识别这是 Pages 项目，
# 并读取下方 bindings（R2 等），无需在 Dashboard 手动绑定
pages_build_output_dir = "dist"

# R2 绑定：存放原图的 bucket（Functions 里通过 env.IMAGES 访问）
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "img01"

# 上传鉴权 token 请用 secret 设置，不要写在这里：
#   npx wrangler pages secret put UPLOAD_TOKEN
# 也可以在 Pages Dashboard → Settings → Functions → Environment variables 里设置

# D1：画作元数据（标题/材质/心得/标签），Functions 里通过 env.DB 访问
[[d1_databases]]
binding = "DB"
database_name = "gallery-db"
database_id = "6391a8bc-1f51-47d2-824b-ef0fed2b276c"

# P2：Cloudflare Access JWT 验证参数（非敏感）。
# CF_ACCESS_TEAM：Zero Trust 团队名，即 https://<team>.cloudflareaccess.com
# CF_ACCESS_AUD：Access 应用配置页的 Application ID (AUD)
# 配置好 Access 应用后填入真实值并取消注释：
# [vars]
#   CF_ACCESS_TEAM = "your-team-name"
#   CF_ACCESS_AUD = "aud-uuid-here"
